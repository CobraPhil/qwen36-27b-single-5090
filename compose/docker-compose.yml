# ===========================================================================
# Default — the config we recommend for general use.
#
# This config PASSES every test in scripts/verify-full.sh:
#   server  genesis  Paris  tool-calls  streaming  thinking  needle-recall
#
# Config: MTP spec-decode n=3 + fp8_e4m3 KV + vision enabled.
#
#   Max ctx   Narr TPS   Code TPS   Tools   Vision   Status
#    20K        66         84         ✅       ✅       validated
#
# Run with:
#   cd compose
#   docker compose up -d
# ===========================================================================
services:
  vllm-qwen36-27b:
    # Pinned to the exact nightly we tested and the Genesis patches verified against.
    image: vllm/vllm-openai@sha256:bbac761a6be466aeab065472830c6e59fc81067e73239b7103546f9cb96138d9
    container_name: vllm-qwen36-27b
    restart: "no"
    ports:
      - "8020:8000"
    volumes:
      - ${MODEL_DIR:-../models}:/root/.cache/huggingface/qwen3.6-27b-autoround-int4
      - ../patches/genesis_shim.py:/patches/patch_genesis_unified.py:ro
      - ../patches/genesis:/patches/genesis:ro
      - ../patches/patch_tolist_cudagraph.py:/patches/patch_tolist_cudagraph.py:ro
      - ~/ai/qwen3.5-enhanced.jinja:/chat-template/qwen3.5-enhanced.jinja:ro
    environment:
      # Uncomment the next line to pin to a specific GPU (e.g. GPU 0):
      - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - VLLM_NO_USAGE_STATS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - NCCL_CUMEM_ENABLE=0
      - VLLM_NO_USAGE_STATS=1
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        pip install xxhash -q
        python3 /patches/patch_genesis_unified.py
        python3 /patches/patch_tolist_cudagraph.py
        exec vllm serve "$@"
      - --
    command:
      - --model
      - /root/.cache/huggingface/qwen3.6-27b-autoround-int4
      - --served-model-name
      - qwen3.6-27b-autoround
      - --quantization
      - auto_round
      - --dtype
      - float16
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "0.94"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "4128"
      # fp8_e4m3 KV (NOT turboquant — MTP + turboquant collapses on tool-call prompts)
      - --kv-cache-dtype
      - fp8_e4m3
      - --trust-remote-code
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      #- qwen3_xml
      - qwen3_coder
      - --chat-template
      - /chat-template/qwen3.5-enhanced.jinja
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"
